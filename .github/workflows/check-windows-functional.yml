name: Test existing unsigned Windows installer functionality
on:
  push:
    branches: [main]
    paths: ['.github/workflows/check-windows-functional.yml']
permissions:
  contents: write
jobs:
  windows-functional:
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - name: Validate and test immutable installer on disposable VM
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $source = (Invoke-WebRequest -Uri 'https://raw.githubusercontent.com/manbuusong-cpu/ai-maker-studio-installers/7770d97ce0523f3121b71d2d19583fab1374c494/ci/windows-functional-check.ps1').Content
          $path = Join-Path $env:RUNNER_TEMP 'windows-functional-check.ps1'
          [IO.File]::WriteAllText($path, [string]$source, [Text.UTF8Encoding]::new($false))
          if ((Get-FileHash $path -Algorithm SHA256).Hash.ToLowerInvariant() -ne '59bdf5d7b16a1792fdb9fcfba99afc6e10f2e0d4b9dfd4b78a84c0daf95ef50a') { throw 'Pinned diagnostics helper hash differs.' }
          $parseTokens = $null; $parseErrors = $null
          $ast = [Management.Automation.Language.Parser]::ParseFile($path, [ref]$parseTokens, [ref]$parseErrors)
          if ($parseErrors.Count) { throw ('Helper syntax error: ' + ($parseErrors.Message -join '; ')) }
          $embedded = @($ast.FindAll({param($node) $node -is [Management.Automation.Language.StringConstantExpressionAst] -and $node.Value.StartsWith('param([string]$Root')}, $true))
          if ($embedded.Count -ne 1) { throw 'Expected exactly one bounded standard-user test script.' }
          $null = [Management.Automation.Language.Parser]::ParseInput($embedded[0].Value, [ref]$parseTokens, [ref]$parseErrors)
          if ($parseErrors.Count) { throw ('Child syntax error: ' + ($parseErrors.Message -join '; ')) }
          & $path
