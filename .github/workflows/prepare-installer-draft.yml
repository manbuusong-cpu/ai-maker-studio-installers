name: Prepare owner-only installer draft
on:
  push:
    branches: [main]
    paths: ['.github/workflows/prepare-installer-draft.yml']
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Create draft release without publishing
        env:
          RELEASE_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import os, json, urllib.request
          repo = os.environ['GITHUB_REPOSITORY']
          if repo != 'manbuusong-cpu/ai-maker-studio-installers':
              raise SystemExit('Unexpected repository')
          endpoint = 'https://api.github.com/repos/' + repo + '/releases'
          headers = {'Authorization': 'Bearer ' + os.environ['RELEASE_TOKEN'], 'Accept': 'application/vnd.github+json', 'User-Agent': 'AI-Maker-Studio-Installer-Draft'}
          with urllib.request.urlopen(urllib.request.Request(endpoint + '?per_page=100', headers=headers), timeout=30) as response:
              releases = json.load(response)
          tag = 'v0.3.1-dev.1'
          release = next((r for r in releases if r['tag_name'] == tag), None)
          if release and not release['draft']:
              raise SystemExit('Refusing to modify a published release')
          if not release:
              body = {'tag_name': tag, 'target_commitish': 'main', 'name': 'AI Maker Studio 0.3.1-dev.1 - unsigned Windows x64 test installer', 'draft': True, 'prerelease': True, 'body': 'Owner-only development installer. Unsigned; production updates disabled. Windows installation, SmartScreen and Defender NOT TESTED. Application source is not included. SHA-256: 4c93d4032860f6ee0b55a76715761c48605527e95b55ecd5730edd5fe8cf9fa6.'}
              request = urllib.request.Request(endpoint, data=json.dumps(body).encode(), headers={**headers, 'Content-Type': 'application/json'}, method='POST')
              with urllib.request.urlopen(request, timeout=30) as response:
                  release = json.load(response)
          if release['draft'] is not True:
              raise SystemExit('Draft visibility check failed')
          print(json.dumps({'id': release['id'], 'draft': release['draft'], 'url': release['html_url']}))
          import hashlib, urllib.parse
          asset = next((a for a in release.get('assets', []) if a['name'] == 'AI-Maker-Studio-Setup-0.3.1-dev.1-Windows-x64-UNSIGNED.exe'), None)
          if not asset or asset['size'] != 137767835:
              raise SystemExit('Expected installer asset missing or size differs')
          class SafeRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  target = urllib.parse.urlparse(newurl)
                  if target.scheme != 'https' or not (target.hostname == 'api.github.com' or (target.hostname or '').endswith('.githubusercontent.com')):
                      raise RuntimeError('Unexpected download redirect')
                  redirected = super().redirect_request(req, fp, code, msg, headers, newurl)
                  if urllib.parse.urlparse(req.full_url).netloc != target.netloc:
                      redirected.remove_header('Authorization')
                  return redirected
          request = urllib.request.Request(asset['url'], headers={**headers, 'Accept':'application/octet-stream'})
          digest, size = hashlib.sha256(), 0
          with urllib.request.build_opener(SafeRedirect()).open(request, timeout=120) as response:
              while chunk := response.read(1024 * 1024):
                  size += len(chunk)
                  if size > 137767835:
                      raise RuntimeError('Installer exceeds expected size')
                  digest.update(chunk)
          if size != 137767835 or digest.hexdigest() != '4c93d4032860f6ee0b55a76715761c48605527e95b55ecd5730edd5fe8cf9fa6':
              raise RuntimeError('Downloaded installer hash differs')
          print(json.dumps({'downloadVerified':True, 'assetId':asset['id'], 'bytes':size, 'sha256':digest.hexdigest()}))
          PY
