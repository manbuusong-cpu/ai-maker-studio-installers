name: Prepare owner-only installer draft
on:
  push:
    branches: [main]
    paths: ['.github/workflows/prepare-installer-draft.yml']
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Create draft release without publishing
        env:
          RELEASE_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import os, json, urllib.request
          repo = os.environ['GITHUB_REPOSITORY']
          if repo != 'manbuusong-cpu/ai-maker-studio-installers':
              raise SystemExit('Unexpected repository')
          endpoint = 'https://api.github.com/repos/' + repo + '/releases'
          headers = {'Authorization': 'Bearer ' + os.environ['RELEASE_TOKEN'], 'Accept': 'application/vnd.github+json', 'User-Agent': 'AI-Maker-Studio-Installer-Draft'}
          with urllib.request.urlopen(urllib.request.Request(endpoint + '?per_page=100', headers=headers), timeout=30) as response:
              releases = json.load(response)
          tag = 'v0.3.1-dev.1'
          release = next((r for r in releases if r['tag_name'] == tag), None)
          if release and not release['draft']:
              raise SystemExit('Refusing to modify a published release')
          if not release:
              body = {'tag_name': tag, 'target_commitish': 'main', 'name': 'AI Maker Studio 0.3.1-dev.1 - unsigned Windows x64 test installer', 'draft': True, 'prerelease': True, 'body': 'Owner-only development installer. Unsigned; production updates disabled. Windows installation, SmartScreen and Defender NOT TESTED. Application source is not included. SHA-256: 4c93d4032860f6ee0b55a76715761c48605527e95b55ecd5730edd5fe8cf9fa6.'}
              request = urllib.request.Request(endpoint, data=json.dumps(body).encode(), headers={**headers, 'Content-Type': 'application/json'}, method='POST')
              with urllib.request.urlopen(request, timeout=30) as response:
                  release = json.load(response)
          if release['draft'] is not True:
              raise SystemExit('Draft visibility check failed')
          print(json.dumps({'id': release['id'], 'draft': release['draft'], 'url': release['html_url']}))
          PY
