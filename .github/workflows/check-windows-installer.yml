name: Collect existing installer Windows security evidence
on:
  push:
    branches: [main]
    paths: ['.github/workflows/check-windows-installer.yml']
permissions:
  contents: write
jobs:
  collect-windows-evidence:
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - name: Check immutable installer on disposable Windows VM
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $source = (Invoke-WebRequest -Uri 'https://raw.githubusercontent.com/manbuusong-cpu/ai-maker-studio-installers/830e677c21f0da011e63acd631b0cd37a1a5e6f1/ci/windows-installer-check.ps1').Content
          $path = Join-Path $env:RUNNER_TEMP 'windows-installer-check.ps1'
          [IO.File]::WriteAllText($path, [string]$source, [Text.UTF8Encoding]::new($false))
          if ((Get-FileHash $path -Algorithm SHA256).Hash.ToLowerInvariant() -ne '534731cd51dcc8f508823598887743ce5451eb8af801858fc8fdc7546275f7d7') { throw 'Diagnostics helper hash differs.' }
          & $path
