name: Collect existing installer Windows security evidence
on:
  push:
    branches: [main]
    paths: ['.github/workflows/check-windows-installer.yml']
permissions:
  contents: write
jobs:
  collect-windows-evidence:
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - name: Check immutable installer on disposable Windows VM
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $source = (Invoke-WebRequest -Uri 'https://raw.githubusercontent.com/manbuusong-cpu/ai-maker-studio-installers/4d7532fe67a15fc3c0e9f784c02cde7512fc3b74/ci/windows-installer-check.ps1').Content
          $path = Join-Path $env:RUNNER_TEMP 'windows-installer-check.ps1'
          [IO.File]::WriteAllText($path, [string]$source, [Text.UTF8Encoding]::new($false))
          if ((Get-FileHash $path -Algorithm SHA256).Hash.ToLowerInvariant() -ne '7cc517874ea575ebc6282a24b5972ddde4dc6c1cd37efc1b5ece4b46105bf2a0') { throw 'Diagnostics helper hash differs.' }
          & $path
